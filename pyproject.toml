[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studybot"
version = "0.1.0"
description = "Minimal practice question agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "websockets>=12.0",
    "openai>=1.0",
    "httpx>=0.25",
    "lark-oapi>=1.0",
]

[project.scripts]
studybot = "studybot.gateway:main"

[tool.setuptools.packages.find]
include = ["studybot*"]
